# Starts a PostgreSQL database for local development.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: trips-postgres
    environment:
      POSTGRES_USER: trips
      POSTGRES_PASSWORD: trips
      POSTGRES_DB: trips
    ports:
      - "5433:5432"   # host port 5433 avoids clashing with a locally installed Postgres
    volumes:
      - trips-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trips -d trips"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trips-pgdata:
